guards:
  secrets: true
  lint: false
  tests: true
  # 180s (gitreins default) false-blocks commits under fleet load: the full
  # suite runs ~4 min idle and >14 min at loadavg 50+. Raised 2026-10-01 after
  # two board commits were blocked with "Tests timed out after 180s" while
  # secrets were clean and the tree was CI-green at HEAD.
  test_timeout: 900
  test_mode: full
  test_command: ./scripts/gitreins-guard-tests.sh
  static_analysis: false
evaluator:
  model: deepseek-v4-flash
  max_iterations: 200
  max_time: "45m"
  # Rung ladder (measured, one raise per starved eval — never guessed):
  #   1M -> 2M -> 4M (all starved) -> 8M PASSED 2026-09-15 (verdict 0a1573bb,
  #   4 criteria / 4 files). 8M re-starved 2026-09-18 on DEPS-002 (5 criteria,
  #   judged diff includes a 1329-line package-lock.json): INCOMPLETE at
  #   'Input token budget (8.0M) exceeded (8.0M used)' verdict 2d9c8074
  #   (8,018,608 tokens_in) and again on an unchanged --force re-run, verdict
  #   51764b96 (8,052,073 tokens_in). Raised to 16M as an UNBLOCK PROBE.
  #   If 16M also starves, the driver is the judged CONTEXT, not the rung:
  #   shrink the criteria (drop the package-lock scope criterion) instead of
  #   climbing further.
  max_input_tokens: "16M"
  max_output_tokens: "384k"
  static_analysis_diagnostics: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
pipeline:
  stages:
    # Mirrors guards policy: secrets + regression-gate tests, NO lint
    # (guards.lint: false — repo has pre-existing eslint warnings). The
    # built-in workdir secrets scanner false-positives on 4 upstream
    # placeholder lines (providers/registry, oauth constants, mitm) —
    # gitleaks (repo scanner, clean) is the authoritative check.
    - id: tier1
      parallel: true
      'on': [pre-commit, pre-eval]
      steps:
        - id: secrets
          type: script
          run: "if command -v gitleaks >/dev/null 2>&1; then gitleaks detect --source . --no-git --no-banner; else true; fi"
          on_fail: continue
        - id: tests
          type: script
          run: ./scripts/gitreins-guard-tests.sh
          timeout: 600
    - id: tier2
      type: ai_eval
      'on': [pre-eval]
      condition: "true"
      max_iterations: -1
      tools: [read_file, run_command, search_pattern, read_diff, sandbox]
